name: .NET build and test
# Re-run on workflow updates so the latest branch state is validated.

on:
  push:
    branches:
      - master
      - feature/opportunity-quality-classification
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MomentumCommandCenterV2.sln
      - name: Build
        run: dotnet build MomentumCommandCenterV2.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MomentumCommandCenterV2.sln --configuration Release --no-build --logger "console;verbosity=normal"
